---
- name: ensure we have an .ssh dir with the correct perms
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.ssh"
    state: directory
    mode: "0700"

# https://specifications.freedesktop.org/basedir-spec/basedir-spec-latest.html
- name: add local bin dir for custom scripts
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/.local/bin"
    state: directory
    recurse: true

- name: add projects dir for various projects
  ansible.builtin.file:
    path: "{{ ansible_facts.user_dir }}/Projects"
    state: directory
    mode: "0700"

# i'm a fan of some "modern" replacements for various utilities
# * https://github.com/ibraheemdev/modern-unix
# * https://zaiste.net/posts/shell-commands-rust/
# * https://lib.rs/command-line-utilities
- name: base packages
  community.general.homebrew:
    state: present
    name:
      - atuin # an improved shell history - https://docs.atuin.sh/
      - bat  # an improved cat, see also https://altbox.dev/
      - cheat # cheat sheets, like tldr but allows for custom cheat sheets
      - diffutils  # gnu diff, macos version lacks color
      - dua-cli  # modern alternative to ncdu
      - eza  # an ls replacement
      # - fasd  # jump navigation - has been disabled in homebrew see https://github.com/Homebrew/homebrew-core/pull/112791
      - fd  # find replacement
      - fzf  # fuzzy finder
      - gawk # for tmux fingers plugin
      - git
      - glow # markdown viewer
      - ispell
      - less # the version that comes with macos is old
      - lesspipe
      - lsd # an ls replacement
      - mackup  # symlink farm
      - neovim # vim replacement
      - starship # fast/cross shell prompt
      - the_silver_searcher  # like ack but faster
      - thefuck # handy console command error corrector - https://github.com/nvbn/thefuck
      - tealdeer # a faster implemention of tldr (community driven man pages)
      - tmux
      - wget
      - zellij # tmux replacement
      - zoxide # jump navigation
      - zsh
    update_homebrew: true

- name: check if oh-my-zsh is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts.user_dir }}/.oh-my-zsh"
  register: dotfiles_zsh_stat_result

- name: install oh-my-zsh
  ansible.builtin.include_tasks:
    file: oh-my-zsh.yml
  when: not dotfiles_zsh_stat_result.stat.exists

- name: find brew binary path
  ansible.builtin.command: which brew
  changed_when: false
  register: dotfiles_brew_binary_path

# This *should* be in zshenv however due to issues with path reordering in macos it's not
# see https://gist.github.com/Linerre/f11ad4a6a934dcf01ee8415c9457e7b2
- name: ensure we have the brew path & brew shell completions loaded on startup
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts.user_dir }}/.zprofile"
    mode: "0644"
    block: |
      eval "$({{ dotfiles_brew_binary_path.stdout }} shellenv)"
      export FPATH="$(brew --prefix)/share/zsh/site-functions:${FPATH}"
    insertbefore: BOF
    create: true

- name: symlinking mackup config
  ansible.builtin.file:
    src: "{{ ansible_facts.user_dir }}/dotfiles/ansible/roles/dotfiles/files/mackup.cfg"
    dest: "{{ ansible_facts.user_dir }}/.mackup.cfg"
    state: link

- name: symlinking mackup config directory
  ansible.builtin.file:
    src: "{{ ansible_facts.user_dir }}/dotfiles/ansible/roles/dotfiles/files/.mackup"
    dest: "{{ ansible_facts.user_dir }}/.mackup"
    state: link

- name: check if there are dotfiles to symlink
  ansible.builtin.command: mackup restore --dry-run
  changed_when: false
  register: dotfiles_mackup_result

- name: restore dotfile config via mackup
  ansible.builtin.command: mackup restore --force
  when: dotfiles_mackup_result.stdout | length > 0
  changed_when: false # TODO: There is an issue with mackup restore not symlinking files, need to fix

- name: install community cheat sheets
  ansible.builtin.git:
    repo: https://github.com/cheat/cheatsheets.git
    dest: "{{ ansible_facts.user_dir }}/.config/cheat/cheatsheets/community"
    version: master

- name: install tmux plugin manager
  ansible.builtin.git:
    repo: https://github.com/tmux-plugins/tpm
    dest: "{{ ansible_facts.user_dir }}/.tmux/plugins/tpm"
    recursive: true
    version: master

- name: install tmux plugins
  ansible.builtin.command: "{{ ansible_facts.user_dir }}/.tmux/plugins/tpm/bin/install_plugins all"
  register: dotfiles_tmux_plugin_result
  changed_when: "'Installing' in dotfiles_tmux_plugin_result.stdout"
