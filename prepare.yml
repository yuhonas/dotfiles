---
- name: prepare machine for converging
  hosts: all
  tasks:
    - name: create dotfiles directory
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/dotfiles"
        state: directory
        mode: "0755"

    - name: copy ansible playbook for execution
      ansible.builtin.command: docker cp {{ playbook_dir }}/. {{ ansible_facts['fqdn'] }}:{{ ansible_facts['user_dir'] }}/dotfiles/ansible
      delegate_to: 127.0.0.1

    - name: set permissions on dotfiles directory
      ansible.builtin.file:
        path: "{{ ansible_facts.user_dir }}/dotfiles"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"
        recurse: true
      become: true

    - name: bootstrap the machine
      ansible.builtin.command: "bash {{ ansible_facts.user_dir }}/dotfiles/ansible/bootstrap.sh"
      environment:
        NO_PROVISION: "1"
  tags: minimal
